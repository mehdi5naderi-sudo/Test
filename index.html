<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحه تست</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}.card{width:min(90%,520px);padding:42px 30px;text-align:center;border-radius:24px;background:rgba(255,255,255,.14);backdrop-filter:blur(12px);box-shadow:0 20px 50px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.25)}h1{font-size:34px;margin:0 0 16px}.subtitle{font-size:18px;opacity:.9;margin-bottom:28px}.btn{border:0;border-radius:14px;padding:13px 25px;font-size:17px;cursor:pointer;background:#fff;color:#5d4aa8;font-weight:bold}.msg{margin-top:22px;font-size:16px;min-height:24px}</style>
</head>
<body>
  <main class="card">
    <h1>🎉 وب‌اپ تستی من</h1>
    <div class="subtitle">این صفحه با موفقیت روی GitHub قرار گرفته است.</div>
    <button class="btn" onclick="test()">کلیک برای تست</button>
    <div class="msg" id="msg"></div>
  </main>
  <script>
    function test(){document.getElementById('msg').textContent='✅ جاوااسکریپت هم به‌درستی کار می‌کند!';}
  </script>
</body>
</html>
