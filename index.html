<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNO فارسی</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#263b58,#0b1422 70%);font-family:Tahoma,Arial;color:#fff;padding:10px}.app{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.top h1{margin:0;font-size:27px}.btn,.ctrl{border:0;border-radius:12px;padding:10px 15px;font-weight:bold;cursor:pointer}.table{background:#ffffff10;border:1px solid #ffffff22;border-radius:24px;padding:14px;box-shadow:0 20px 60px #0008}.players{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.p{background:#ffffff0b;border-radius:13px;padding:9px;text-align:center;border:1px solid #ffffff15}.p.active{outline:2px solid #ffd43b}.p b{display:block}.p small{opacity:.75}.center{display:flex;justify-content:center;align-items:center;gap:25px;height:190px}.pile,.card{border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:bold;box-shadow:0 7px 16px #0008}.pile{width:82px;height:116px;font-size:27px}.back{background:repeating-linear-gradient(45deg,#17213a,#17213a 8px,#263457 8px,#263457 16px);border:4px solid #fff}.card{width:72px;height:104px;border:3px solid #fff;font-size:24px;text-align:center}.red{background:#e53935}.yellow{background:#f6c51b;color:#151515}.green{background:#18a558}.blue{background:#287be8}.black{background:#20242c}.info{text-align:center;min-height:45px}.hand{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;min-height:108px}.hand .card{cursor:pointer;transition:.15s}.hand .card:hover{transform:translateY(-7px)}.off{opacity:.32;cursor:not-allowed!important;transform:none!important}.controls{text-align:center;margin-top:10px}.ctrl{margin:4px}.draw{background:#fff}.uno{background:#ffd02b}.hint{text-align:center;opacity:.7;font-size:12px;margin-top:8px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}.modal.on{display:flex}.box{background:#18243a;border-radius:20px;padding:22px;text-align:center;width:min(92%,400px)}.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px}.colors button{border:0;border-radius:12px;height:55px;font-weight:bold;font-size:17px;cursor:pointer}.cr{background:#e53935;color:#fff}.cy{background:#f6c51b}.cg{background:#18a558;color:#fff}.cb{background:#287be8;color:#fff}@media(max-width:520px){.top h1{font-size:22px}.table{padding:9px}.center{height:160px;gap:14px}.pile{width:70px;height:100px}.card{width:61px;height:90px;font-size:20px}.hand{gap:5px}}</style></head><body><div class="app"><div class="top"><h1>🃏 UNO فارسی</h1><button class="btn" onclick="newGame()">🔄 بازی جدید</button></div><div class="table"><div class="players" id="players"></div><div class="center"><div><div class="pile back" id="draw">🂠</div><div class="hint">دسته کارت</div></div><div><div class="pile" id="discard"></div><div class="hint">کارت زمین</div></div></div><div class="info"><b id="msg"></b><div class="hint" id="color"></div></div><h3 style="text-align:center">کارت‌های شما</h3><div class="hand" id="hand"></div><div class="controls"><button class="ctrl draw" onclick="humanDraw()">➕ برداشتن کارت</button><button class="ctrl uno" onclick="uno()">UNO 🔥</button></div><div class="hint">بازی شما در برابر ۳ حریف کامپیوتری است. ۷ کارت شروع؛ تطبیق رنگ، عدد یا نماد. شامل +۲، رد نوبت، تغییر جهت، وایلد و +۴.</div></div></div><div class="modal" id="modal"><div class="box"><h2>🎨 انتخاب رنگ</h2><div class="colors"><button class="cr" onclick="pick('red')">قرمز ❤️</button><button class="cy" onclick="pick('yellow')">زرد 💛</button><button class="cg" onclick="pick('green')">سبز 💚</button><button class="cb" onclick="pick('blue')">آبی 💙</button></div></div></div><script>const C=['red','yellow','green','blue'],FA={red:'قرمز',yellow:'زرد',green:'سبز',blue:'آبی'},N=['شما','🤖 علی','🤖 سارا','🤖 رضا'];let P,D,S,T,dir,col,wild,over,timer;function card(c,v){return{c,v,id:Math.random().toString(36).slice(2)}}function make(){let d=[];C.forEach(c=>{d.push(card(c,'0'));for(let n=1;n<10;n++)d.push(card(c,''+n),card(c,''+n));['skip','rev','+2'].forEach(v=>d.push(card(c,v),card(c,v)))});for(let i=0;i<4;i++)d.push(card('black','wild'),card('black','+4'));return d}function sh(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function newGame(){clearTimeout(timer);D=sh(make());S=[];P=[[],[],[],[]];T=0;dir=1;col=null;wild=null;over=false;for(let p=0;p<4;p++)for(let i=0;i<7;i++)P[p].push(D.pop());let x;do{x=D.pop()}while(x.c==='black');S=[x];col=x.c;msg('شروع شد! نوبت شماست.');render()}function top(){return S[S.length-1]}function refill(){if(D.length||S.length<2)return;let x=S.pop();D=sh(S);S=[x]}function drawCard(){refill();return D.pop()}function ok(x){let t=top();return x.c==='black'||x.c===col||x.v===t.v}function lab(v){return{skip:'⛔',rev:'↩️','+2':'+2',wild:'🌈','+4':'+4'}[v]||v}function html(x,off){return`<div class="card ${x.c}${off?' off':''}" ${!off?`onclick="play('${x.id}')"`:''}>${lab(x.v)}</div>`}function render(){document.getElementById('players').innerHTML=P.map((h,i)=>`<div class="p ${i===T?'active':''}"><b>${N[i]} ${i===T?'🎯':''}</b><small>${h.length} کارت${h.length===1?' ⚠️':''}</small></div>`).join('');document.getElementById('discard').className='pile '+top().c;document.getElementById('discard').textContent=lab(top().v);document.getElementById('draw').textContent='🂠 '+D.length;document.getElementById('hand').innerHTML=P[0].map(x=>html(x,over||T!==0||!ok(x))).join('');document.getElementById('color').textContent='رنگ فعلی: '+FA[col]}function msg(x){document.getElementById('msg').textContent=x;render()}function next(){T=(T+dir+4)%4}function play(id){if(over||T!==0)return;let i=P[0].findIndex(x=>x.id===id);if(i<0)return;let x=P[0][i];if(!ok(x)){msg('❌ این کارت قابل بازی نیست.');return}P[0].splice(i,1);use(x,0)}function use(x,p){S.push(x);if(x.c!=='black')col=x.c;if(P[p].length===0){win(p);return}if(x.v==='rev')dir*=-1;if(x.v==='skip')next();next();if(x.v==='+2')for(let i=0;i<2;i++){let z=drawCard();if(z)P[T].push(z)}if(x.v==='+4')for(let i=0;i<4;i++){let z=drawCard();if(z)P[T].push(z)}if(x.c==='black'&&p===0){wild=x;document.getElementById('modal').classList.add('on');msg('رنگ را انتخاب کن.');return}if(x.c==='black'){col=C[Math.floor(Math.random()*4)]}msg(N[p]+' کارت '+lab(x.v)+' را بازی کرد.');if(T!==0)timer=setTimeout(ai,650)}function pick(c){if(!wild)return;col=c;wild=null;document.getElementById('modal').classList.remove('on');msg('رنگ شد: '+FA[c]);if(T!==0)timer=setTimeout(ai,650)}function humanDraw(){if(over||T!==0)return;let x=drawCard();if(!x){msg('دسته کارت تمام شده است.');return}P[0].push(x);if(ok(x))msg('کارت قابل بازی است؛ می‌توانی آن را بازی کنی.');else{next();msg('کارت قابل بازی نبود؛ نوبت حریف.');timer=setTimeout(ai,600)}}function ai(){if(over||T===0)return;let p=T,h=P[p],a=h.filter(ok),x=a.length?a[Math.floor(Math.random()*a.length)]:drawCard();if(!x){next();timer=setTimeout(ai,500);return}if(!h.includes(x))h.push(x);if(!ok(x)){next();render();timer=setTimeout(ai,500);return}h.splice(h.indexOf(x),1);use(x,p)}function uno(){if(P[0].length===1)msg('🔥 UNO!');else msg('برای UNO باید فقط یک کارت داشته باشی.')}function win(p){over=true;clearTimeout(timer);msg(p===0?'🏆 شما برنده شدید! 🎉':N[p]+' برنده شد!');document.getElementById('color').textContent='برای شروع دوباره «بازی جدید» را بزن.'}newGame();</script></body></html>
