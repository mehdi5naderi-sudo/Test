<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>هنگمن</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#101827,#263b59);font-family:Tahoma,Arial,sans-serif;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}.box{width:min(100%,620px);background:#ffffff12;border:1px solid #ffffff25;border-radius:24px;padding:20px;box-shadow:0 18px 50px #0008;text-align:center}h1{margin:0 0 5px;font-size:30px}.sub{opacity:.8;margin-bottom:10px}.hang{font-size:64px;height:75px}.word{font-size:32px;letter-spacing:6px;min-height:48px;margin:8px 0}.status{margin:8px;font-size:17px}.result{min-height:28px;font-weight:bold;font-size:18px}.keys{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:12px}.key{min-height:43px;border:0;border-radius:9px;background:#fff;color:#172236;font-size:17px;font-weight:bold;cursor:pointer}.key:disabled{opacity:.25;cursor:default}.new{margin-top:16px;border:0;border-radius:12px;padding:12px 24px;font-size:16px;font-weight:bold;cursor:pointer}@media(max-width:430px){.box{padding:15px}.keys{grid-template-columns:repeat(6,1fr);gap:6px}.key{min-height:42px}.word{font-size:27px;letter-spacing:4px}.hang{font-size:55px;height:65px}h1{font-size:26px}}</style></head><body><main class="box"><h1>🎯 هنگمن</h1><div class="sub">حروف کلمه را حدس بزن</div><div class="hang" id="hang">🪵</div><div class="word" id="word"></div><div class="status" id="status"></div><div class="result" id="result"></div><div class="keys" id="keys"></div><button class="new" onclick="start()">🔄 بازی جدید</button></main><script>const W=['کتاب','مدرسه','خورشید','دوچرخه','پرنده','کامپیوتر','هواپیما','باران','دریا','گربه','دوست','سیب','ماشین','کوه','باغ','پنجره','ماه','ستاره','جنگل','کشتی','درخت','خانه','مداد','میز','صندلی'];const K=['ا','ب','پ','ت','ث','ج','چ','ح','خ','د','ذ','ر','ز','ژ','س','ش','ص','ض','ط','ظ','ع','غ','ف','ق','ک','گ','ل','م','ن','و','ه','ی'];let w,g,b;function start(){w=W[Math.floor(Math.random()*W.length)];g=[];b=[];draw()}function draw(){document.getElementById('word').textContent=[...w].map(x=>g.includes(x)?x:'_').join(' ');document.getElementById('status').textContent='فرصت باقی‌مانده: '+(6-b.length)+' از 6';document.getElementById('hang').textContent=['🪵','🪵🙂','🪵😐','🪵😟','🪵😰','🪵😨','🪦💀'][b.length];const q=document.getElementById('keys');q.innerHTML='';K.forEach(x=>{const z=document.createElement('button');z.className='key';z.textContent=x;z.disabled=g.includes(x)||b.includes(x);z.onclick=()=>guess(x);q.appendChild(z)});if([...w].every(x=>g.includes(x)))end(1);else if(b.length>=6)end(0)}function guess(x){if(w.includes(x))g.push(x);else b.push(x);draw()}function end(ok){document.getElementById('result').textContent=ok?'🎉 آفرین! کلمه را پیدا کردی.':'❌ تمام شد! کلمه: '+w;document.querySelectorAll('.key').forEach(x=>x.disabled=true)}start()</script></body></html>
